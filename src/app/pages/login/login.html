<div class="min-h-screen flex">
  <!-- Imagen lateral -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
    <img
      src="https://images.unsplash.com/photo-1775993167393-f2add1f8eec2?w=800"
      class="w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900/80 via-emerald-900/50 to-slate-900/60"></div>
    <div class="absolute bottom-12 left-12 text-white">
      <p class="text-2xl font-bold">
        "La forma más fácil de reservar una cancha en Bolivia."
      </p>
      <span class="text-emerald-300 text-sm">
        Carlos Mendoza · Usuario verificado
      </span>
    </div>
  </div>

  <!-- Formulario -->
  <div class="flex-1 flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
      <button (click)="goHome()" class="text-slate-500 text-sm mb-8 flex items-center gap-1">
        ← Volver al inicio
      </button>

      <div class="flex items-center gap-3 mb-8">
        <span class="brand-art"><img src="/logo.png" alt="SportReserva" width="1024" height="690" /></span>
      </div>

      <h1 class="text-2xl font-bold text-slate-900">
        Bienvenido de vuelta
      </h1>
      <p class="text-slate-500 text-sm mb-6">
        Ingresa tus credenciales para continuar
      </p>

      @if(errorMessage) {
        <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm p-3 rounded-xl mb-4">
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="handleSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm mb-2 text-slate-700">Correo electrónico</label>
          <input
            type="email"
            [(ngModel)]="form.email"
            name="email"
            placeholder="cliente@canchas.com"
            required
            class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-emerald-500"
          />
        </div>

        <div>
          <label class="block text-sm mb-2 text-slate-700">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="form.password"
            name="password"
            placeholder="••••••••"
            required
            class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-emerald-500"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-medium transition-colors disabled:opacity-50"
        >
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading">Iniciando sesión...</span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200 text-center">
        <p class="text-sm text-slate-500 mb-3">Usuarios para la demostración</p>
        <div class="flex flex-wrap gap-2 justify-center">
          <button type="button" (click)="setDemoAccount('CLIENTE')" [disabled]="loading" class="min-h-11 px-3 py-2 bg-slate-100 hover:bg-emerald-50 text-slate-700 rounded-lg text-sm">👤 Cliente</button>
          <button type="button" (click)="setDemoAccount('SECRETARIA')" [disabled]="loading" class="min-h-11 px-3 py-2 bg-slate-100 hover:bg-emerald-50 text-slate-700 rounded-lg text-sm">📋 Secretaría</button>
          <button type="button" (click)="setDemoAccount('ADMIN')" [disabled]="loading" class="min-h-11 px-3 py-2 bg-slate-100 hover:bg-emerald-50 text-slate-700 rounded-lg text-sm">⚙️ Administrador</button>
        </div>
        <p class="text-xs text-slate-500 mt-2">Selecciona un rol y pulsa Iniciar sesión.</p>
      </div>

      <p class="text-center text-sm text-slate-500 mt-6">
        ¿No tienes cuenta?
        <button (click)="goRegister()" class="text-emerald-600 font-semibold hover:underline">
          Crear una cuenta
        </button>
      </p>
    </div>
  </div>
</div>
